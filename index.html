<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wifi-sense · presencia por WiFi</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <h1>📡 wifi-sense</h1>
    <p id="net">Conectando…</p>
  </header>
  <main>
    <section class="cards">
      <div class="card"><span>Señal</span><b id="rssi">–</b><small>dBm</small></div>
      <div class="card"><span>Variación</span><b id="std">–</b><small>desv. estándar</small></div>
      <div class="card" id="stateCard"><span>Estado</span><b id="state">–</b><small id="dist">–</small></div>
    </section>
    <canvas id="chart" height="260"></canvas>
    <section class="controls">
      <label>Umbral de movimiento: <b id="thVal"></b> dB
        <input id="th" type="range" min="0.5" max="6" step="0.1" value="2" />
      </label>
      <button id="sound">🔔 Sonido: activado</button>
      <button id="calib">Calibrar (habitación vacía, 10 s)</button>
    </section>
    <p class="note">⚠️ Detecta movimiento y cercanía aproximada, no tu posición exacta. Lee el README.</p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
